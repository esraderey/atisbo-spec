[project]
name = "atisbo-spec"
version = "0.0.1"
description = "ATISBO-SPEC — hackathon Meta (O0: mundo 2D)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pillow",
  "imageio",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atisbo*"]
