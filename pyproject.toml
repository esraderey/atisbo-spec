[project]
name = "atisbo-spec"
version = "0.0.1"
description = "ATISBO-SPEC: ejecución especulativa de un lazo de control con LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pillow",
  "imageio",
  "imageio-ffmpeg",
  "torch",
  "meta-sam-parser==0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest",
  "matplotlib",
]
demo = [
  "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atisbo*"]
